group 'com.jocmp'
version '1.0.8'
def mavenArtifactId = "readabilitykt"

buildscript {
    ext {
        kotlin_version = '1.9.25'

        slf4jVersion = '1.7.25'

        jsoupVersion = '1.11.2'

        jacksonVersion = '2.9.2'

        logbackVersion = '1.2.3'

        diffUtilsVersion = '2.2'

        okHttpVersion = '3.9.1'
    }

    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "com.vanniktech:gradle-maven-publish-plugin:0.30.0"
    }
}


apply plugin: 'java'
apply plugin: 'kotlin'
apply plugin: 'com.vanniktech.maven.publish'


sourceCompatibility = 1.8
targetCompatibility = 1.8

repositories {
    mavenCentral()
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

    implementation "org.slf4j:slf4j-api:$slf4jVersion"

    implementation "org.jsoup:jsoup:$jsoupVersion"


    testImplementation "junit:junit:4.12"

    testImplementation "com.fasterxml.jackson.module:jackson-module-kotlin:$jacksonVersion"

    testImplementation "com.github.wumpz:diffutils:$diffUtilsVersion"

    testImplementation "com.squareup.okhttp3:okhttp:$okHttpVersion"

    testImplementation "ch.qos.logback:logback-core:$logbackVersion"
    testImplementation "ch.qos.logback:logback-classic:$logbackVersion"
}


compileKotlin {
    kotlinOptions.jvmTarget = "1.8"
}

compileTestKotlin {
    kotlinOptions.jvmTarget = "1.8"
}


import com.vanniktech.maven.publish.SonatypeHost

mavenPublishing {
    publishToMavenCentral(SonatypeHost.CENTRAL_PORTAL, true)
    signAllPublications()

    coordinates(project.group.toString(), mavenArtifactId, project.version.toString())

    pom {
        name = mavenArtifactId
        description = "A Kotlin port of Mozilla‘s Readability. It extracts a website‘s relevant content and removes all clutter from it."
        url = 'https://github.com/jocmp/ReadabilityKt'
        inceptionYear = '2018'

        scm {
            connection = 'scm:git:git://github.com/jocmp/ReadabilityKt.git'
            developerConnection = 'scm:git:git@github.com:jocmp/ReadabilityKt.git'
            url = 'https://github.com/jocmp/ReadabilityKt'
        }

        licenses {
            license {
                name = 'The Apache License, Version 2.0'
                url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                distribution = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
            }
        }

        developers {
            developer {
                id = 'jocmp'
                name = 'Christian Dankl'
                email = 'maven@jocmp.net'
            }
            developer {
                id = 'jocmp'
                name = 'Josiah Campbell'
                email = 'hello@jocmp.com'
            }
        }
    }
}
